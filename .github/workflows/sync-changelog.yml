name: Sync Changelog

on:
  repository_dispatch:
    types: [extension-release]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync changelog from extension releases
        run: bash scripts/sync-changelog.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet install.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-changelog
          commit-message: "chore: sync changelog from extension releases"
          title: "chore: sync changelog from extension releases"
          body: |
            Auto-generated by the [sync-changelog workflow](https://github.com/${{ github.repository }}/actions/workflows/sync-changelog.yml).

            Updates the changelog on `install.html` with the latest releases from the extension repo.
          labels: automated
