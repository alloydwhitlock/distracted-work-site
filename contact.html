<!DOCTYPE html>
<html lang="en">
<head>

    .contact-box p { margin-bottom: 0.5rem; }

    <div class="contact-box">
      <p>Email</p>
      <a class="email-link" id="emailLink" href="#">Loading...</a>

  <footer class="site-footer">

    <a class="coffee-link" href="https://ko-fi.com/adamwhitlock" target="_blank" rel="noopener">(buy him a coffee)</a>

  <script>
    (function () {
      var u = 'support';
      var d = 'distracted.work';
      var link = document.getElementById('emailLink');
      var addr = u + '@' + d;
      link.href = 'mailto:' + addr;
      link.textContent = addr;
    })();
